; Two static PJSIP endpoints for the CI P2P call test — 1112 (EP1) and 1113
; (EP2), both authenticating with password "secret". direct_media=yes so
; Asterisk only proxies signaling; once the call is up it re-INVITEs both
; legs to send RTP straight to each other, exercising callraven's documented
; direct_media re-INVITE handling (see README's "Asterisk direct_media /
; Re-INVITE Handling" section).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WS transport, layered on the HTTP server enabled in http.conf — lets the
; P2P test also exercise callraven's WebSocket-based SIP transport (the
; app's default), not just UDP-RAW. See entrypoint.sh for why
; res_pjsip_transport_websocket needs a post-boot nudge to actually load.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[1112]
type=endpoint
context=internal
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=1112-auth
aors=1112
direct_media=yes

[1112-auth]
type=auth
auth_type=userpass
username=1112
password=secret

[1112]
type=aor
max_contacts=1

[1113]
type=endpoint
context=internal
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=1113-auth
aors=1113
direct_media=yes

[1113-auth]
type=auth
auth_type=userpass
username=1113
password=secret

[1113]
type=aor
max_contacts=1

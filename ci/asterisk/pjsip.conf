; Five static PJSIP endpoints — 1112 (EP1) and 1113 (EP2) for the CI P2P
; call test, 1114 (EP3) for transfer/conference tests that need a third
; party, and 1115/1116 (dedicated SRTP endpoints, media_encryption=sdes)
; for the CI SRTP call test. All authenticate with password "secret".
; direct_media=yes so Asterisk only proxies signaling; once a call is up
; it re-INVITEs both legs to send RTP straight to each other, exercising
; callraven's documented PBX media redirection / re-INVITE handling (see
; README).
;
; 1115/1116 are separate, SRTP-only endpoints rather than adding
; media_encryption=sdes to 1112-1114: that setting is mandatory (Asterisk
; rejects a plain RTP/AVP offer), which would break the plain-RTP P2P/
; transfer/conference tests that don't opt into secureMediaEnabled.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WS transport, layered on the HTTP server enabled in http.conf — lets the
; P2P test also exercise callraven's WebSocket-based SIP transport (the
; app's default), not just UDP-RAW. See entrypoint.sh for why
; res_pjsip_transport_websocket needs a post-boot nudge to actually load.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[1112]
type=endpoint
context=internal
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=1112-auth
aors=1112
direct_media=yes

[1112-auth]
type=auth
auth_type=userpass
username=1112
password=secret

[1112]
type=aor
max_contacts=1

